version: '3.8'

services:
  auth-service:
    image: streaming-auth:latest
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  admin-service:
    image: streaming-admin:latest
    ports:
      - "5002:5002"
    environment:
      - PORT=5002

  chat-service:
    image: streaming-chat:latest
    ports:
      - "5003:5003"
    environment:
      - PORT=5003

  streaming-service:
    image: streaming-streaming:latest
    ports:
      - "5004:5004"
    environment:
      - PORT=5004

  frontend:
    image: streaming-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - admin-service
